<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Melodia | The Melody in Every Moment</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" role="main" aria-labelledby="login-heading">
            
            <!-- Header with Logo -->
            <div class="auth-header">
                <img src="logo.svg" alt="Melodia Logo" class="auth-logo">
                <h2 id="login-heading">Welcome Back</h2>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">
                        <i class="far fa-envelope" aria-hidden="true"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com"
                        required 
                        aria-required="true"
                    >
                </div>
                
                <!-- Password Field with Toggle -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required 
                            aria-required="true"
                            minlength="8"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePasswordVisibility('password')"
                            aria-label="Toggle password visibility"
                        >
                            <i class="far fa-eye" id="passwordToggleIcon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
                
                <!-- Message Containers -->
                <div class="error-message" id="loginError" role="alert"></div>
                <div class="success-message" id="loginSuccess" role="status"></div>
                
                <!-- Form Options -->
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="checkmark"></span>
                        <span class="checkbox-label">Remember me</span>
                    </label>
                    <a href="#" id="forgotPassword" class="forgot-link">Forgot Password?</a>
                </div>
            </form>
            
            <!-- Auth Links -->
            <div class="auth-links">
                <p>
                    <span>New to Melodia?</span>
                    <a href="signup.html" class="signup-link">
                        Create Account <i class="fas fa-user-plus" aria-hidden="true"></i>
                    </a>
                </p>
                
                <!-- Social Login -->
                <div class="social-login">
                    <div class="social-divider">
                        <span>Or continue with</span>
                    </div>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google" aria-label="Sign in with Google">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-btn facebook" aria-label="Sign in with Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="social-btn apple" aria-label="Sign in with Apple">
                            <i class="fab fa-apple"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Additional Styles for Enhanced Features -->
    <style>
        /* Password Toggle Styles */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        
        .password-wrapper input {
            padding-right: 45px !important;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 8px;
            transition: var(--transition-default);
            font-size: 1.1rem;
        }
        
        .password-toggle:hover {
            color: var(--color-text-primary);
        }
        
        .password-toggle:focus-visible {
            outline: 2px solid var(--color-primary-light);
            border-radius: var(--border-radius-sm);
        }
        
        /* Form Options Styles */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: var(--spacing-md) 0 var(--spacing-sm);
        }
        
        /* Custom Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding-left: 28px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            user-select: none;
        }
        
        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        
        .checkmark {
            position: absolute;
            left: 0;
            height: 18px;
            width: 18px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: var(--transition-default);
        }
        
        .checkbox-container:hover input ~ .checkmark {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .checkbox-container input:checked ~ .checkmark {
            background: var(--color-primary);
            border-color: var(--color-primary);
        }
        
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        
        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }
        
        .checkbox-container .checkmark:after {
            left: 6px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .checkbox-label {
            margin-left: 5px;
        }
        
        .forgot-link {
            color: var(--color-primary-light);
            text-decoration: none;
            font-size: var(--font-size-sm);
            transition: var(--transition-default);
        }
        
        .forgot-link:hover {
            color: var(--color-text-primary);
            text-decoration: underline;
        }
        
        .signup-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--color-primary) !important;
            font-weight: var(--font-weight-semibold);
        }
        
        .signup-link i {
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }
        
        .signup-link:hover i {
            transform: translateX(3px);
        }
        
        /* Social Login Styles */
        .social-login {
            margin-top: var(--spacing-lg);
        }
        
        .social-divider {
            position: relative;
            text-align: center;
            margin-bottom: var(--spacing-md);
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .social-divider::before,
        .social-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .social-divider::before {
            left: 0;
        }
        
        .social-divider::after {
            right: 0;
        }
        
        .social-divider span {
            background: transparent;
            padding: 0 var(--spacing-xs);
        }
        
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        
        .social-btn {
            width: 45px;
            height: 45px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            color: var(--color-text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition-default);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .social-btn:hover {
            background: var(--color-surface-hover);
            color: var(--color-text-primary);
            transform: translateY(-2px);
            border-color: var(--color-primary-light);
        }
        
        .social-btn:active {
            transform: translateY(0);
        }
        
        .social-btn.google:hover {
            color: #DB4437;
        }
        
        .social-btn.facebook:hover {
            color: #4267B2;
        }
        
        .social-btn.apple:hover {
            color: #ffffff;
        }
        
        .auth-btn i {
            margin-left: 8px;
            transition: transform 0.2s ease;
        }
        
        .auth-btn:hover i {
            transform: translateX(3px);
        }
        
        /* Loading State */
        .auth-btn.loading .btn-text {
            opacity: 0;
        }
        
        .auth-btn.loading i {
            display: none;
        }
    </style>

    <!-- JavaScript for Password Toggle -->
    <script>
        function togglePasswordVisibility(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form submission example with loading state
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('loginError');
            const successMsg = document.getElementById('loginSuccess');
            
            // Add loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                // Remove loading state
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                
                // Show error message for demo
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Invalid email or password';
                
                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }, 1500);
        });
    </script>
</body>
</html>

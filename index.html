<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeerVibes</title>

  <!-- No external font requests — system fonts only -->

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />

  <!-- Cyberpunk Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== OVERLAY (mobile sidebar backdrop) ===================== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== TOP NAVBAR ===================== -->
  <header class="navbar" id="navbar">
    <div class="navbar__left">
      <!-- Hamburger (mobile only) -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <!-- Logo -->
      <div class="logo">
        <div class="logo__icon">
          <img src="logo.svg" alt="GeerVibes Logo" style="width:36px;height:36px;display:block;" />
        </div>
        <span class="logo__text">
          GeerVibes
          <em>The Melody</em>
          <em>in Every Moment</em>
        </span>
      </div>
    </div>

    <div class="navbar__center">
      <!-- Search -->
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass search-bar__icon"></i>
        <input
          type="text"
          id="searchInput"
          class="search-bar__input"
          placeholder="Search songs, artists…"
          autocomplete="off"
        />
        <button class="search-bar__clear" id="searchClear" aria-label="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="navbar__right">
      <!-- Theme toggle -->
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
      <!-- User avatar -->
      <div class="user-avatar" title="User Profile">
        <span>GV</span>
      </div>
    </div>
  </header>

  <!-- ===================== APP SHELL ===================== -->
  <div class="app-shell">

    <!-- ===================== LEFT SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <!-- Nav links -->
      <nav class="sidebar__nav">
        <ul>
          <li>
            <a href="#" class="sidebar__link active" data-page="home">
              <i class="fa-solid fa-house"></i>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar__link" data-page="discover">
              <i class="fa-solid fa-compass"></i>
              <span>Discover</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar__link" data-page="library">
              <i class="fa-solid fa-layer-group"></i>
              <span>Library</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar__link" data-page="playlists">
              <i class="fa-solid fa-list-music"></i>
              <span>Playlists</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar__divider"></div>

      <!-- Your Library / Playlist -->
      <div class="sidebar__library">
        <div class="sidebar__library-header">
          <h3>Your Library</h3>
          <span class="playlist-count" id="playlistCount">8 songs</span>
        </div>

        <ul class="playlist" id="playlistSidebar">
          <!-- Populated by JS -->
        </ul>
      </div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main-content">

      <!-- ---- PLAYER CARD ---- -->
      <section class="player-card" id="playerCard">

        <!-- Album art -->
        <div class="album-art-wrapper">
          <div class="album-art-ring"></div>
          <div class="album-art-ring album-art-ring--2"></div>
          <div class="album-art" id="albumArt">
            <img src="https://picsum.photos/id/1011/400" alt="Album Art" id="albumImg" />
          </div>
        </div>

        <!-- Song info -->
        <div class="song-info">
          <h1 class="song-info__title" id="songTitle">Neon Horizon</h1>
          <p class="song-info__artist" id="songArtist">Stellar Drift</p>
          <p class="song-info__album" id="songAlbum">SoundHelix Originals</p>
        </div>

        <!-- Waveform visualizer -->
        <div class="visualizer" id="visualizer">
          <div class="visualizer__bar" style="--i:1"></div>
          <div class="visualizer__bar" style="--i:2"></div>
          <div class="visualizer__bar" style="--i:3"></div>
          <div class="visualizer__bar" style="--i:4"></div>
          <div class="visualizer__bar" style="--i:5"></div>
          <div class="visualizer__bar" style="--i:6"></div>
          <div class="visualizer__bar" style="--i:7"></div>
          <div class="visualizer__bar" style="--i:8"></div>
          <div class="visualizer__bar" style="--i:9"></div>
          <div class="visualizer__bar" style="--i:10"></div>
          <div class="visualizer__bar" style="--i:11"></div>
          <div class="visualizer__bar" style="--i:12"></div>
          <div class="visualizer__bar" style="--i:13"></div>
          <div class="visualizer__bar" style="--i:14"></div>
          <div class="visualizer__bar" style="--i:15"></div>
          <div class="visualizer__bar" style="--i:16"></div>
          <div class="visualizer__bar" style="--i:17"></div>
          <div class="visualizer__bar" style="--i:18"></div>
          <div class="visualizer__bar" style="--i:19"></div>
          <div class="visualizer__bar" style="--i:20"></div>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <span class="progress-time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar" role="slider" aria-label="Seek">
            <div class="progress-bar__fill" id="progressFill"></div>
            <div class="progress-bar__thumb" id="progressThumb"></div>
          </div>
          <span class="progress-time" id="totalTime">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <!-- Secondary row -->
          <div class="controls__secondary">
            <button class="ctrl-btn ctrl-btn--sm" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
              <i class="fa-solid fa-shuffle"></i>
            </button>
            <button class="ctrl-btn ctrl-btn--sm" id="repeatBtn" aria-label="Repeat" title="Repeat">
              <i class="fa-solid fa-repeat"></i>
            </button>
          </div>

          <!-- Primary row -->
          <div class="controls__primary">
            <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
              <i class="fa-solid fa-backward-step"></i>
            </button>
            <button class="ctrl-btn ctrl-btn--play" id="playBtn" aria-label="Play / Pause">
              <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Next">
              <i class="fa-solid fa-forward-step"></i>
            </button>
          </div>

          <!-- Volume row -->
          <div class="controls__volume">
            <button class="ctrl-btn ctrl-btn--sm" id="muteBtn" aria-label="Mute">
              <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            </button>
            <div class="volume-slider-wrapper">
              <input
                type="range"
                id="volumeSlider"
                class="volume-slider"
                min="0"
                max="100"
                value="80"
                aria-label="Volume"
              />
            </div>
            <span class="volume-label" id="volumeLabel">80%</span>
          </div>
        </div>

      </section>

      <!-- ---- MAIN PLAYLIST (right panel on desktop) ---- -->
      <section class="main-playlist-section">
        <div class="main-playlist-header">
          <h2>Queue <span id="queueCount">8</span></h2>
          <div class="playlist-sort">
            <button class="sort-btn active" id="sortAll">All</button>
            <button class="sort-btn" id="sortFav">Favourites</button>
          </div>
        </div>

        <ul class="main-playlist" id="mainPlaylist">
          <!-- Populated by JS -->
        </ul>
      </section>

    </main>
  </div>

  <!-- ===================== MOBILE BOTTOM MINI-PLAYER ===================== -->
  <div class="mini-player" id="miniPlayer">
    <img src="https://picsum.photos/id/1011/80" alt="Mini Art" id="miniArt" class="mini-player__art" />
    <div class="mini-player__info">
      <span class="mini-player__title" id="miniTitle">Neon Horizon</span>
      <span class="mini-player__artist" id="miniArtist">Stellar Drift</span>
    </div>
    <div class="mini-player__controls">
      <button class="ctrl-btn ctrl-btn--sm" id="miniPrevBtn"><i class="fa-solid fa-backward-step"></i></button>
      <button class="ctrl-btn ctrl-btn--play-sm" id="miniPlayBtn"><i class="fa-solid fa-play" id="miniPlayIcon"></i></button>
      <button class="ctrl-btn ctrl-btn--sm" id="miniNextBtn"><i class="fa-solid fa-forward-step"></i></button>
    </div>
    <div class="mini-player__progress">
      <div class="mini-player__progress-fill" id="miniProgressFill"></div>
    </div>
  </div>

  <!-- Hidden Audio Element -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <!-- Main Script (unchanged) -->
  <script src="script.js"></script>
</body>
</html>
